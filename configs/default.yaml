model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float16
  max_seq_len: 4096
  trust_remote_code: false
runtime:
  device: auto
  max_running: 4
  warmup_iterations: 3
  output_dir: results
workload:
  mode: poisson
  arrival_rate: 1.0
  request_count: 12
  prompt_distribution: mixed
  prompt_length: 512
  output_length: 32
  min_prompt_length: 128
  max_prompt_length: 1024
  short_prompt_min: 128
  short_prompt_max: 512
  long_prompt_min: 768
  long_prompt_max: 1536
  short_prompt_probability: 0.7
  seed: 42
  corpus:
    - "The history of scientific discovery is shaped by careful observation, reproducible experiments, and the exchange of ideas."
    - "A reliable computer system balances throughput, latency, memory use, and fairness across competing requests."
    - "Researchers evaluate language models using transparent methods, representative workloads, and measurements from real hardware."
scheduler:
  mode: compare
  chunk_size: 256
  chunk_sizes: [64, 128, 256, 512, 1024]
  token_budget: null
sweep:
  seeds: [11, 23, 37]
  arrival_rates: [0.5, 1.0, 2.0, 4.0]
  prompt_lengths: [512, 1024, 2048, 3072]
  max_running_values: [2, 4, 8, 16]
  request_count: 12
  fixed_arrival_rate: 1.0
  burst_request_count: 16
